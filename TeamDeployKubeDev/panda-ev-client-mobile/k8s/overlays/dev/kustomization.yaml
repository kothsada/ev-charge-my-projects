apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: panda-ev-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: panda-mobile-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/1/args
        value:
          - "--structured-logs"
          - "--port=5432"
          - "--private-ip"
          - "--health-check"
          - "--http-address=0.0.0.0"
          - "pandaev:asia-southeast1:panda-ev-instance-mobile-db-dev"
          - "pandaev:asia-southeast1:panda-ev-instance-system-db-dev?port=5434"
          - "pandaev:asia-southeast1:panda-ev-instance-core-db-dev?port=5435"

configMapGenerator:
  - name: panda-mobile-api-config
    behavior: merge
    literals:
      - NODE_ENV="development"
      - REDIS_URL="redis://redis-service.panda-ev-dev.svc.cluster.local:6379"
      - GATEWAY_URL="http://panda-gateway-api-service.panda-ev-dev.svc.cluster.local:4004"
