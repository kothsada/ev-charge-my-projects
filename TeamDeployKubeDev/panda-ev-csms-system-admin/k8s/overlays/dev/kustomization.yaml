apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: panda-ev-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: panda-system-api
    patch: |-
      # 1. System DB Proxy — port 5432
      - op: replace
        path: /spec/template/spec/containers/1/args/5
        value: "pandaev:asia-southeast1:panda-ev-instance-system-db-dev"
      # 2. Core DB Proxy — port 5433 (gateway + noti schemas)
      - op: replace
        path: /spec/template/spec/containers/2/args/6
        value: "pandaev:asia-southeast1:panda-ev-instance-core-db-dev"
      # 3. Mobile DB Proxy — port 5434 (wallet/session — base hardcodes PROD, must override for dev)
      - op: replace
        path: /spec/template/spec/containers/3/args/6
        value: "pandaev:asia-southeast1:panda-ev-instance-mobile-db-dev"
      # 4. OCPP DB Proxy — port 5436
      - op: replace
        path: /spec/template/spec/containers/4/args/6
        value: "pandaev:asia-southeast1:panda-ev-instance-ocpp-db-dev"

configMapGenerator:
  - name: panda-system-api-config
    behavior: merge
    literals:
      - NODE_ENV="development"
      - REDIS_HOST="redis-service.panda-ev-dev.svc.cluster.local"
      - REDIS_URL="redis://redis-service.panda-ev-dev.svc.cluster.local:6379"
