apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-ocpp-api
  labels:
    app: panda-ocpp-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panda-ocpp-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: panda-ocpp-api
    spec:
      serviceAccountName: panda-ocpp-api-ksa
      terminationGracePeriodSeconds: 60
      containers:
        - name: panda-ocpp-api
          image: asia-southeast1-docker.pkg.dev/pandaev/panda-ev-repo/panda-ocpp-api:latest
          imagePullPolicy: Always
          ports:
            - name: ws
              containerPort: 4002
          envFrom:
            - configMapRef:
                name: panda-ocpp-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: panda-ocpp-api-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: panda-rabbitmq-prod-secrets
                  key: RABBITMQ_URL
            - name: SERVICE_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: panda-ocpp-api-secrets
                  key: SERVICE_JWT_PRIVATE_KEY
            - name: TRUSTED_SERVICE_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: panda-ocpp-api-secrets
                  key: TRUSTED_SERVICE_PUBLIC_KEYS
          readinessProbe:
            tcpSocket:
              port: 4002
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4002
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--private-ip"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "REPLACE_WITH_INSTANCE_CONNECTION_NAME"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
