apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-redis
  labels:
    app: panda-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panda-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: panda-redis
    spec:
      containers:
        - name: redis
          image: asia-southeast1-docker.pkg.dev/pandaev/panda-ev-repo/redis:dev
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - mountPath: /data
              name: redis-data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
