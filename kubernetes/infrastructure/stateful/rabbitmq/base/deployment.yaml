apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-rabbitmq-dev
  labels:
    app: panda-rabbitmq-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panda-rabbitmq-dev
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: panda-rabbitmq-dev
    spec:
      containers:
        - name: rabbitmq
          image: asia-southeast1-docker.pkg.dev/pandaev/panda-ev-repo/rabbitmq:dev
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "user"
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: panda-rabbitmq-dev-secrets
                  key: rabbitmq-password
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: panda-rabbitmq-dev-secrets
                  key: rabbitmq-erlang-cookie
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: rabbitmq-data
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data-pvc
